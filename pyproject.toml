[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qrypton"
version = "0.1.0"
description = "Enterprise cryptographic discovery and quantum-risk assessment contracts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "QRYPTON" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "pathspec>=0.12,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
ui = [
  "plotly>=5.24,<6",
  "streamlit>=1.40,<2",
]

[project.scripts]
qrypton = "qrypton.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.115,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qrypton"]
artifacts = ["src/qrypton/exporters/schemas/cyclonedx/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*", "plotly", "plotly.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["qrypton.ui.mock_provider"]
ignore_errors = true
